<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ========================= -->
    <!-- Primary SEO -->
    <!-- ========================= -->

    <title>
      Event Perambra | Wedding & Stage Decoration
    </title>

    <meta
      name="description"
      content="Event Perambra provides elegant wedding, stage and event decoration services in Perambra and surrounding areas. Beautiful designs and memorable celebrations."
    />

    <meta
      name="keywords"
      content="Event Perambra, wedding decoration, stage decoration, wedding stage decoration, event decoration, function decoration, Kerala wedding decoration, Perambra decoration"
    />

    <meta
      name="author"
      content="Event Perambra"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://event-perambra.vercel.app/"
    />

    <!-- ========================= -->
    <!-- Open Graph / WhatsApp -->
    <!-- ========================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Event Perambra | Wedding & Stage Decoration"
    />

    <meta
      property="og:description"
      content="Beautiful wedding, stage and event decorations designed to make your celebrations unforgettable."
    />

    <meta
      property="og:url"
      content="https://event-perambra.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Event Perambra"
    />

    <!-- IMPORTANT: Put event-perambra-og.jpg inside public/ -->
    <meta
      property="og:image"
      content="https://event-perambra.vercel.app/event-perambra-og.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://event-perambra.vercel.app/event-perambra-og.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Event Perambra Wedding and Stage Decoration"
    />

    <!-- ========================= -->
    <!-- Twitter / X -->
    <!-- ========================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Event Perambra | Wedding & Stage Decoration"
    />

    <meta
      name="twitter:description"
      content="Elegant wedding, stage and event decoration services by Event Perambra."
    />

    <meta
      name="twitter:image"
      content="https://event-perambra.vercel.app/event-perambra-og.jpg"
    />

    <!-- ========================= -->
    <!-- Theme -->
    <!-- ========================= -->

    <meta
      name="theme-color"
      content="#0b1713"
    />

    <!-- ========================= -->
    <!-- Favicon -->
    <!-- ========================= -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <!-- ========================= -->
    <!-- Google Fonts -->
    <!-- ========================= -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-[#FAF8F5] text-[#1E1E1E] antialiased selection:bg-[#E8DFC8] selection:text-[#1A1A1A]"
  >
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
